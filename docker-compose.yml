services:
  web-tools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-tools-dev
    command: >
      sh -c "echo 'App URL: http://localhost:5173' &&
      echo &&
      npm run dev -- --host 0.0.0.0 --port 5173 --clearScreen false"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - web_tools_node_modules:/app/node_modules

volumes:
  web_tools_node_modules:
